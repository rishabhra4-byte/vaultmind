services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      VAULTMIND_DATABASE_URL: postgresql+psycopg://vaultmind:vaultmind@db:5432/vaultmind
      VAULTMIND_STORAGE_DIR: /data/storage
      VAULTMIND_JWT_SECRET: ${VAULTMIND_JWT_SECRET:-please-set-a-long-random-secret-in-env}
      VAULTMIND_ANTHROPIC_API_KEY: ${VAULTMIND_ANTHROPIC_API_KEY:-}
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultmind
      POSTGRES_PASSWORD: vaultmind
      POSTGRES_DB: vaultmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultmind"]
      interval: 3s
      retries: 10

volumes:
  files:
  pgdata:
