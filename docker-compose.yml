# Production-style stack: the app (in production mode) plus PostgreSQL.
#
#   cp .env.example .env
#   echo "VAULTMIND_JWT_SECRET=$(openssl rand -hex 32)" >> .env
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
#   docker compose up --build
#
# For a public demo with the nine demo accounts, add VAULTMIND_SEED_DEMO_DATA=true to .env.
# For a real install, leave it out and create the first administrator (then add people on the
# admin page, import them from a spreadsheet, or sync them from Google / Microsoft):
#   docker compose exec app python -m app.cli create-admin --email you@company.com --name "Your Name"
#   docker compose exec app python -m app.cli create-user --email ... --name ... --team ... --position senior
# See "Deploying for real" in the README.

services:
  app:
    build: .
    image: vaultmind:local
    ports:
      - "8000:8000"
    environment:
      VAULTMIND_ENV: production
      VAULTMIND_DATABASE_URL: postgresql+psycopg://vaultmind:${POSTGRES_PASSWORD:-vaultmind}@db:5432/vaultmind
      VAULTMIND_STORAGE_DIR: /data/storage
      VAULTMIND_JWT_SECRET: ${VAULTMIND_JWT_SECRET:?Set VAULTMIND_JWT_SECRET in .env, e.g. openssl rand -hex 32}
      VAULTMIND_SEED_DEMO_DATA: ${VAULTMIND_SEED_DEMO_DATA:-false}
      VAULTMIND_ANTHROPIC_API_KEY: ${VAULTMIND_ANTHROPIC_API_KEY:-}
      VAULTMIND_HSTS: ${VAULTMIND_HSTS:-false}
      VAULTMIND_PUBLIC_URL: ${VAULTMIND_PUBLIC_URL:-}
      # Scheduled backups, each checked by restoring it (docs/operations.md). Point this at
      # storage outside this machine (a mounted, encrypted volume), e.g. /backups.
      VAULTMIND_BACKUP_DIR: ${VAULTMIND_BACKUP_DIR:-}
      VAULTMIND_BACKUP_INTERVAL_HOURS: ${VAULTMIND_BACKUP_INTERVAL_HOURS:-24}
      VAULTMIND_BACKUP_KEEP: ${VAULTMIND_BACKUP_KEEP:-14}
      VAULTMIND_SESSION_IDLE_MINUTES: ${VAULTMIND_SESSION_IDLE_MINUTES:-120}
      # Optional connections (docs/integrations.md). Unset ones stay off.
      VAULTMIND_FOLDER_ROOTS: ${VAULTMIND_FOLDER_ROOTS:-[]}
      VAULTMIND_GOOGLE_SERVICE_ACCOUNT_FILE: ${VAULTMIND_GOOGLE_SERVICE_ACCOUNT_FILE:-}
      VAULTMIND_GOOGLE_ADMIN_EMAIL: ${VAULTMIND_GOOGLE_ADMIN_EMAIL:-}
      VAULTMIND_GOOGLE_CLIENT_ID: ${VAULTMIND_GOOGLE_CLIENT_ID:-}
      VAULTMIND_GOOGLE_CLIENT_SECRET: ${VAULTMIND_GOOGLE_CLIENT_SECRET:-}
      VAULTMIND_GOOGLE_ALLOWED_DOMAINS: ${VAULTMIND_GOOGLE_ALLOWED_DOMAINS:-[]}
      VAULTMIND_MICROSOFT_TENANT_ID: ${VAULTMIND_MICROSOFT_TENANT_ID:-}
      VAULTMIND_MICROSOFT_CLIENT_ID: ${VAULTMIND_MICROSOFT_CLIENT_ID:-}
      VAULTMIND_MICROSOFT_CLIENT_SECRET: ${VAULTMIND_MICROSOFT_CLIENT_SECRET:-}
      VAULTMIND_MICROSOFT_SSO: ${VAULTMIND_MICROSOFT_SSO:-false}
      VAULTMIND_PASSWORD_LOGIN: ${VAULTMIND_PASSWORD_LOGIN:-true}
      VAULTMIND_SMTP_HOST: ${VAULTMIND_SMTP_HOST:-}
      VAULTMIND_SMTP_PORT: ${VAULTMIND_SMTP_PORT:-587}
      VAULTMIND_SMTP_USERNAME: ${VAULTMIND_SMTP_USERNAME:-}
      VAULTMIND_SMTP_PASSWORD: ${VAULTMIND_SMTP_PASSWORD:-}
      VAULTMIND_SMTP_FROM: ${VAULTMIND_SMTP_FROM:-}
      VAULTMIND_SLACK_BOT_TOKEN: ${VAULTMIND_SLACK_BOT_TOKEN:-}
      VAULTMIND_SLACK_SIGNING_SECRET: ${VAULTMIND_SLACK_SIGNING_SECRET:-}
      # Behind a reverse proxy, set this to the proxy's address so uvicorn trusts its
      # X-Forwarded-For header and sign-in limits see each person's real address.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultmind}
      POSTGRES_DB: vaultmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultmind"]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  files:
  pgdata:
