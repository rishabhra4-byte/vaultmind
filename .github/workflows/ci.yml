name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultmind
          POSTGRES_PASSWORD: vaultmind
          POSTGRES_DB: vaultmind_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check app tests alembic eval
          ruff format --check app tests alembic eval
      - name: Known vulnerabilities in dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Tests (${{ matrix.database }})
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            export VAULTMIND_DATABASE_URL=postgresql+psycopg://vaultmind:vaultmind@localhost:5432/vaultmind_test
          fi
          pytest
      - name: Answer quality has not regressed (benchmark against eval/baseline.json)
        # The benchmark builds its own throwaway SQLite database, so one leg is enough.
        if: matrix.database == 'sqlite'
        run: python -m eval.run --check --out eval-report.json
      - name: Keep the benchmark report
        if: always() && matrix.database == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: answer-quality-report
          path: backend/eval-report.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high
      - name: Type check and build
        run: npm run build
      - name: No secrets in the bundle
        run: |
          if grep -rEl "sk-ant-|ANTHROPIC_API_KEY|JWT_SECRET" dist; then echo "Secret-like string found in the frontend bundle"; exit 1; fi

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build the app
        run: |
          pip install -r backend/requirements.txt
          (cd frontend && npm ci && npm run build)
          cp -r frontend/dist backend/static
      - name: Start the server with fresh demo data
        working-directory: backend
        env:
          VAULTMIND_SEED_DEMO_DATA: "true"
        run: |
          export VAULTMIND_JWT_SECRET=$(openssl rand -hex 32)
          nohup python -m uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for i in $(seq 60); do curl -fs localhost:8000/api/ready && break; sleep 1; done
          curl -fs localhost:8000/api/ready
      - name: Cache the ${{ matrix.browser }} build
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install ${{ matrix.browser }}
        working-directory: e2e
        # System packages come from the Ubuntu mirrors, which are sometimes very slow (one
        # WebKit install took 26 minutes). The runner image already has what Chromium and
        # Firefox need, so apt only runs when the browser can't start without it.
        timeout-minutes: 30
        run: |
          npm ci
          npx playwright install ${{ matrix.browser }}
          if ! node -e "require('playwright')['${{ matrix.browser }}'].launch().then((b) => b.close())"; then
            echo "Installing system packages for ${{ matrix.browser }}"
            npx playwright install-deps ${{ matrix.browser }}
          fi
      - name: Browser audit (${{ matrix.browser }})
        working-directory: e2e
        run: BROWSER=${{ matrix.browser }} npm run audit
      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            e2e/report-*.json
            e2e/shots/
            backend/server.log

  docker:
    name: docker runtime
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure a demo deployment
        run: |
          echo "VAULTMIND_JWT_SECRET=$(openssl rand -hex 32)" > .env
          echo "VAULTMIND_SEED_DEMO_DATA=true" >> .env
      - name: Build the production image
        run: docker compose build
      - name: Alert rules are valid (promtool)
        run: docker run --rm -v "$PWD/deploy:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/prometheus-alerts.yml
      - name: Production mode refuses to start without a secret
        run: |
          set +e
          out=$(docker run --rm -e VAULTMIND_JWT_SECRET= vaultmind:local 2>&1); code=$?
          set -e
          echo "$out" | tail -3
          test "$code" -ne 0
          echo "$out" | grep -q "VAULTMIND_JWT_SECRET must be set"
      - name: Start app and PostgreSQL
        run: docker compose up -d
      - name: Wait until the container reports healthy
        run: |
          for i in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            echo "health: $status"; [ "$status" = "healthy" ] && exit 0; sleep 3
          done
          docker compose logs app; exit 1
      - name: Smoke-test the running container
        run: bash e2e/docker-smoke.sh http://localhost:8000
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Full browser audit against the container (production mode, PostgreSQL)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium
          npm run audit
      - name: Data survives a restart
        run: |
          docker compose restart app
          for i in $(seq 60); do curl -fs localhost:8000/api/ready >/dev/null && break; sleep 2; done
          bash e2e/docker-smoke.sh http://localhost:8000 --after-restart
      - name: A backup passes its restore check, and restores into a new PostgreSQL database
        run: |
          docker compose exec -T app python -m app.cli backup --out /data/backups
          archive=$(docker compose exec -T app sh -c 'ls -1 /data/backups/vaultmind-backup-*.tar.gz | tail -1')
          docker compose exec -T db createdb -U vaultmind vaultmind_restored
          restored="postgresql+psycopg://vaultmind:vaultmind@db:5432/vaultmind_restored"
          docker compose exec -T -e VAULTMIND_DATABASE_URL="$restored" -e VAULTMIND_STORAGE_DIR=/tmp/restored app \
            python -m app.cli restore "$archive" --yes
          docker compose exec -T -e RESTORED="$restored" app python - <<'EOF'
          import os
          from sqlalchemy import create_engine, text
          live, copy = create_engine(os.environ["VAULTMIND_DATABASE_URL"]), create_engine(os.environ["RESTORED"])
          for table in ("users", "teams", "documents", "document_chunks", "document_versions", "groups"):
              with live.connect() as a, copy.connect() as b:
                  n = a.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar()
                  m = b.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar()
              print(f"{table}: {n} live, {m} restored")
              assert n == m and n > 0, table
          EOF
      - name: No errors in the application log
        run: |
          docker compose logs app > app.log
          if grep -nE "Traceback|\bERROR\b|CRITICAL" app.log; then echo "Errors found in the app log"; exit 1; fi
      - name: Graceful shutdown
        run: |
          docker compose stop -t 30 app
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq app)")
          docker compose logs app | tail -5
          echo "exit code: $code"
          # uvicorn shuts down cleanly, then re-raises SIGTERM, so 143 (128+15) is a graceful exit.
          # 137 would mean Docker had to SIGKILL it after the grace period.
          [ "$code" = "0" ] || [ "$code" = "143" ]
          docker compose logs app | grep -q "Application shutdown complete"
      - name: Keep the evidence when it fails
        if: failure()
        run: docker compose logs > compose.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence
          path: |
            compose.log
            app.log
            e2e/report-*.json
            e2e/shots/
