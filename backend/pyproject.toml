[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E741"]  # Depends() in defaults is idiomatic FastAPI

[tool.ruff.lint.per-file-ignores]
"app/seed_docs.py" = ["E501"]  # prose
"app/seed.py" = ["E501"]
"app/assistant.py" = ["E501"]  # prompt text

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
